name: Apply admin navigation source fix once

on:
  push:
    paths:
      - '.github/workflows/admin-nav-source-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch admin navigation sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  print(f'WARN missing pattern in {path}: {old[:80]}')
                  return False
              p.write_text(text.replace(old,new))
              print('patched',path)
              return True

          replace_required(
              'assets/firebase-pages.js',
              '<a class="on">Dashboard</a><a>預約管理</a><a>預約行事曆</a><a>顧客資料</a><a>服務管理</a><a>價格管理</a><a>網站設定</a>',
              '<a class="on" href="#dashboard">Dashboard</a><a href="#bookings">預約管理</a><a href="#calendar">預約行事曆</a><a href="#customers">顧客資料</a><a href="#services">服務功能</a><a href="#slots">時段功能</a><a href="#pricing">價格功能</a><a href="#settings">網站設定</a>'
          )

          p=Path('assets/admin-v2.js')
          text=p.read_text()
          text=text.replace('${view==="services"?"服務管理":"價格管理"}', '${view==="services"?"服務功能":"價格功能"}')
          text=text.replace(
              'if(view==="services"||view==="pricing")return delegateCatalog(view);\n  if(view==="settings")return renderSettings();',
              'if(view==="services"||view==="pricing")return delegateCatalog(view);\n  if(view==="slots"){setBaseVisibility(false);const w=ensureWorkspace();if(w){w.hidden=false;w.innerHTML=`<div class="admin-view-head"><div><span class="tag">AVAILABILITY</span><h3>時段功能</h3></div></div><p class="muted">正在載入時段功能…</p>`;}setTimeout(()=>window.dispatchEvent(new HashChangeEvent("hashchange")),0);return;}\n  if(view==="settings")return renderSettings();'
          )
          text=text.replace(
              'const map={"總覽":"dashboard","Dashboard":"dashboard","預約管理":"bookings","預約行事曆":"calendar","顧客資料":"customers","服務管理":"services","價格管理":"pricing","網站設定":"settings"};',
              'const map={"總覽":"dashboard","Dashboard":"dashboard","預約管理":"bookings","預約行事曆":"calendar","顧客資料":"customers","服務管理":"services","服務功能":"services","時段功能":"slots","價格管理":"pricing","價格功能":"pricing","網站設定":"settings"};'
          )
          text=text.replace(
              'if(["bookings","calendar","customers","services","pricing","settings"].includes(hash))renderView(hash);',
              'if(["bookings","calendar","customers","services","slots","pricing","settings"].includes(hash))renderView(hash);'
          )
          p.write_text(text)
          print('patched assets/admin-v2.js')

          p=Path('assets/admin-functions.js')
          text=p.read_text()
          old='if (s?.dataset.adminV2Bound === "1" && !document.querySelector(".sidebar [data-admin-slot-link]")) {'
          new='if (s?.dataset.adminV2Bound === "1" && ![...document.querySelectorAll(".sidebar a")].some((link)=>(link.textContent||"").trim()==="時段功能")) {'
          if old in text:
              text=text.replace(old,new)
          else:
              print('WARN slot insertion condition already changed')
          p.write_text(text)
          print('patched assets/admin-functions.js')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/admin-nav-source-fix-once.yml
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/firebase-pages.js assets/admin-v2.js assets/admin-functions.js .github/workflows/admin-nav-source-fix-once.yml
          git commit -m 'fix: make admin function navigation native and stable'
          git push origin HEAD:main
