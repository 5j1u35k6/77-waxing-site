name: Apply admin 08:00 start support once

on:
  push:
    paths:
      - '.github/workflows/admin-time-0800-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch 08:00 support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'assets/admin-v2.js': [
                  ('live.bookingStartTime||"10:00"', 'live.bookingStartTime||"08:00"'),
                  ('Array.from({length:21},(_,i)=>{const mins=600+i*30;', 'Array.from({length:25},(_,i)=>{const mins=480+i*30;'),
              ],
              'assets/booking-v3.js': [
                  ('for (let minutes = 600; minutes <= 1200; minutes += 30)', 'for (let minutes = 480; minutes <= 1200; minutes += 30)'),
              ],
              'assets/firebase-pages.js': [
                  ('for (let minutes = 600; minutes <= 1200; minutes += 30)', 'for (let minutes = 480; minutes <= 1200; minutes += 30)'),
              ],
              'assets/runtime-settings.js': [
                  ("settings.bookingStartTime||'10:00'", "settings.bookingStartTime||'08:00'"),
              ],
              'assets/booking-slot-status.js': [
                  ('for (let minutes = 600; minutes <= 1200; minutes += 30)', 'for (let minutes = 480; minutes <= 1200; minutes += 30)'),
              ],
              'assets/admin-functions.js': [
                  ('general.bookingStartTime || "10:00"', 'general.bookingStartTime || "08:00"'),
              ],
          }

          changed = []
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed.append(filename)
          print('Patched:', ', '.join(changed) if changed else 'none')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/admin-time-0800-once.yml
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/admin-v2.js assets/booking-v3.js assets/firebase-pages.js assets/runtime-settings.js assets/booking-slot-status.js assets/admin-functions.js .github/workflows/admin-time-0800-once.yml
          git commit -m 'fix: support booking start times from 08:00'
          git push origin HEAD:main
