name: Build email footer v21

on:
  push:
    branches: [main]
    paths:
      - 'assets/_v21_payload.txt'
      - '.github/workflows/footer-v21-build.yml'

permissions:
  contents: write

jobs:
  build-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode verified footer image
        run: |
          base64 -d assets/_v21_payload.txt > assets/email-footer-77waxing-v21.jpg
          test "$(stat -c%s assets/email-footer-77waxing-v21.jpg)" -gt 5000
          file assets/email-footer-77waxing-v21.jpg | grep -q 'JPEG image data'
      - name: Update Apps Script to v21
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps-script/Code.gs')
          s = p.read_text()
          s = s.replace("const SCRIPT_VERSION = '2026-09-10-email-v20';", "const SCRIPT_VERSION = '2026-09-10-email-v21';")
          s = s.replace("const EMAIL_FOOTER_IMAGE = 'https://5j1u35k6.github.io/77-waxing-site/assets/email-footer-77waxing.jpg?v=20260910-2028';", "const EMAIL_FOOTER_IMAGE = 'https://5j1u35k6.github.io/77-waxing-site/assets/email-footer-77waxing-v21.jpg';")
          s = s.replace('77waxing｜Footer v20 穩定圖片路徑測試', '77waxing｜Footer v21 正確格式圖片測試')
          s = s.replace('這版改回既有且曾正常顯示的 Footer 圖片網址，並沿用已合成完成的山海橫幅內容，避免 Gmail 顯示破圖。', '這版使用全新檔名與真正 baseline JPEG，保留原山海構圖與手寫字，其他文字已放大，避免 Gmail 圖片代理沿用舊格式快取。')
          s = s.replace('footer-stable-path-v20-sent:', 'footer-baseline-jpeg-v21-sent:')
          s = s.replace("mode: 'flattened-composite-stable-path-v20'", "mode: 'baseline-jpeg-unique-path-v21'")
          p.write_text(s)
          PY
      - name: Remove temporary payload files
        run: |
          rm -f assets/_v21_payload.txt assets/email-footer-77waxing-v21-base64.txt
      - name: Commit generated binary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/Code.gs assets/email-footer-77waxing-v21.jpg assets/_v21_payload.txt assets/email-footer-77waxing-v21-base64.txt
          git commit -m 'fix: publish Gmail-safe footer v21 [skip ci]'
          git push
