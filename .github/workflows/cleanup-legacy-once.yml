name: Cleanup legacy runtime once

# Temporary one-shot cleanup. Delete this workflow after the cleanup commit lands.
on:
  push:
    paths:
      - '.github/workflows/cleanup-legacy-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Remove obsolete runtime and simplify active code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          obsolete = [
              'assets/admin-catalog-route-bridge.js',
              'assets/booking-boot.js',
              'assets/booking-display-fix.js',
              'assets/booking-prefill-direct.js',
              'assets/home-intro.css',
              'intro-demo/index.html',
              'components/booking-wizard.tsx',
          ]
          for name in obsolete:
              path = Path(name)
              if path.exists():
                  path.unlink()
                  print('removed', name)

          path = Path('assets/admin-functions.js')
          text = path.read_text()
          text = text.replace('const VERSION = "20260911-0841";', 'const VERSION = "20260911-0931";')
          start = text.find('\nfunction serviceLink()')
          end = text.find('\nfunction timeOptions()', start)
          if start != -1 and end != -1:
              text = text[:start] + text[end:]
          text = text.replace('    syncFunctionLabels();\n', '')
          text = text.replace(
              'observer.observe(document.querySelector("#app") || document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["data-admin-v2-bound"] });',
              'observer.observe(document.querySelector("#app") || document.body, { childList: true, subtree: true });'
          )
          path.write_text(text)

          path = Path('assets/booking-v3.js')
          text = path.read_text()
          text = text.replace('    document.body.classList.remove("booking-boot");\n', '')
          text = text.replace('  if (!catalog.length) { document.body.classList.remove("booking-boot"); return; }', '  if (!catalog.length) return;')
          path.write_text(text)

          path = Path('admin/index.html')
          text = path.read_text().replace('admin-functions.js?v=20260911-0904', 'admin-functions.js?v=20260911-0931')
          path.write_text(text)

          path = Path('PROJECT_STATE.md')
          text = path.read_text()
          cleanup = '''\n\n## 2026-09-11 舊程式清理基準\n\n- 已移除未被正式頁面載入的舊 runtime／補丁：`admin-catalog-route-bridge.js`、`booking-boot.js`、`booking-display-fix.js`、`booking-prefill-direct.js`。\n- 已移除舊首頁實驗資產 `home-intro.css` 與 `/intro-demo/`，正式首頁仍保留目前實際使用的 `home-warm-intro.js/.css`。\n- 已移除 Next.js 已被 `booking-wizard-v2.tsx` 取代的 `booking-wizard.tsx`。\n- `admin-functions.js` 不再改寫側欄文字或動態插入 `#slots`；側欄唯一來源維持 `firebase-pages.js` + `admin-v2.js`。\n- `booking-v3.js` 已移除不再使用的 `booking-boot` 相容碼。\n- 一次性舊 footer workflow 與 CI workflow 的整理由 GitHub 連線直接處理，不由 Actions 自我修改。\n- v19/v21/v22/v23 等舊 Email footer 圖片暫時保留，因為歷史已寄出的 Email 可能仍直接引用這些公開 URL；刪除會造成舊信件破圖。\n- 後續若要刪除任何公開 URL 資產，先確認沒有既有 Email、書籤或外部頁面仍引用。\n'''
          if '## 2026-09-11 舊程式清理基準' not in text:
              text += cleanup
          path.write_text(text)
          PY

      - name: Verify removed runtime is no longer referenced
        run: |
          set -euo pipefail
          for token in \
            admin-catalog-route-bridge.js \
            booking-boot.js \
            booking-display-fix.js \
            booking-prefill-direct.js \
            home-intro.css \
            'intro-demo/'; do
            if grep -R --exclude-dir=.git --exclude='PROJECT_STATE.md' --exclude='cleanup-legacy-once.yml' -n -- "$token" .; then
              echo "Unexpected remaining reference: $token"
              exit 1
            fi
          done

      - name: Validate JavaScript
        run: |
          set -euo pipefail
          for file in assets/*.js; do
            if grep -Eq '^[[:space:]]*(import|export)[[:space:]]' "$file"; then
              temp="/tmp/$(basename "${file%.js}").mjs"
              cp "$file" "$temp"
              node --check "$temp"
            else
              node --check "$file"
            fi
          done

      - name: Validate Next.js build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit cleanup
        run: |
          rm -f package-lock.json
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove obsolete legacy front and admin code'
          git push origin HEAD:main
