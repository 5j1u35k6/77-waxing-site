name: Fix about copy once

on:
  push:
    paths:
      - '.github/workflows/fix-about-copy-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact copy patch
        run: python3 scripts/fix-about-copy-once.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/pages.js
          grep -q '<h1>品牌故事</h1>' assets/pages.js
          grep -q '關於『好好對待自己』的儀式' assets/pages.js
          grep -q '讓來到這裡的每一個人，都能變得更好 。' assets/pages.js
          grep -q '把肌膚與心情都安心地交給我。' assets/pages.js
          ! grep -q 'ABOUT 77 · BRAND STORY' assets/pages.js
          ! grep -q '01 · 落腳' assets/pages.js
          ! grep -q '02 · 初心' assets/pages.js
          ! grep -q '03 · 堅持' assets/pages.js
          ! grep -q '04 · 安心' assets/pages.js
          ! grep -q 'WELCOME TO 77WAXING' assets/pages.js
          ! grep -q '從香港到台灣，找到想留下來的地方。' assets/pages.js
          grep -q '不得自行新增小標、編號、摘要、CTA、英文字樣' PROJECT_STATE.md
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pages.js assets/about-story.css index.html PROJECT_STATE.md
          git commit -m 'fix: use exact supplied brand story copy'
          git push origin main
