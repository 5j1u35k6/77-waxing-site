name: Fix home intro first paint once

on:
  push:
    paths:
      - '.github/workflows/fix-home-intro-first-paint-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply first-paint intro fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Bootstrap the intro before the homepage can paint.
          p = Path('index.html')
          text = p.read_text()
          anchor = '<link rel="stylesheet" href="/77-waxing-site/assets/pages.css?v=20260911-1922">'
          bootstrap = '''<script>(()=>{const B=location.hostname.endsWith('github.io')?'/77-waxing-site':'';let p=location.pathname.startsWith(B)?location.pathname.slice(B.length):location.pathname;if(p!==\'/\'&&p!==\'\')return;try{if(sessionStorage.getItem(\'77waxing-brand-intro-v5-seen\')===\'1\')return;}catch{}document.documentElement.classList.add(\'brand-intro-pending\');setTimeout(()=>document.documentElement.classList.remove(\'brand-intro-pending\'),8000);})();</script><style>html.brand-intro-pending,html.brand-intro-pending body{background:#1b1917!important}html.brand-intro-pending .header,html.brand-intro-pending #app,html.brand-intro-pending .site-footer{visibility:hidden!important}</style><link rel="stylesheet" href="/77-waxing-site/assets/home-warm-intro.css?v=20260912-1237">'''
          if anchor not in text:
              raise SystemExit('pages.css anchor not found')
          text = text.replace(anchor, bootstrap + anchor, 1)
          body_anchor = '<body><header class="header">'
          body_new = '<body><script src="/77-waxing-site/assets/home-warm-intro.js?v=20260912-1237"></script><header class="header">'
          if body_anchor not in text:
              raise SystemExit('body/header anchor not found')
          text = text.replace(body_anchor, body_new, 1)
          p.write_text(text)

          # 2) Make the intro script assume CSS is already render-blocking in <head>,
          #    mark the session as soon as the animation starts, and reveal the page
          #    underneath only when the overlay begins its exit fade.
          p = Path('assets/home-warm-intro.js')
          p.write_text('''(()=>{\n  const B=location.hostname.endsWith('github.io')?'/77-waxing-site':'';\n  const KEY='77waxing-brand-intro-v5-seen';\n  const path=location.pathname.startsWith(B)?location.pathname.slice(B.length):location.pathname;\n  if(path!=='/'&&path!=='')return;\n  try{if(sessionStorage.getItem(KEY)==='1')return;sessionStorage.setItem(KEY,'1')}catch{}\n\n  const html=document.documentElement;\n  const root=document.createElement('section');\n  root.id='brandIntro';\n  root.setAttribute('aria-label','77waxing 開場動畫');\n  root.innerHTML=`<button class="brand-intro-skip" type="button" data-brand-skip>略過</button><div class="brand-intro-stage" aria-hidden="true"><div class="brand-intro-mark"><span class="brand-intro-base"><b>77</b>waxing</span><span class="brand-intro-lit"><b>77</b>waxing</span><span class="brand-intro-sheen"></span></div></div>`;\n  document.body.appendChild(root);\n\n  const prevOverflow=document.body.style.overflow;\n  document.body.style.overflow='hidden';\n  const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;\n  const timers=[];\n  let finished=false;\n  let started=false;\n\n  const later=(fn,ms)=>timers.push(setTimeout(fn,ms));\n  const finish=()=>{\n    if(finished)return;\n    finished=true;\n    timers.forEach(clearTimeout);\n    html.classList.remove('brand-intro-pending');\n    document.body.style.overflow=prevOverflow;\n    root.remove();\n  };\n  const exit=()=>{\n    if(finished)return;\n    html.classList.remove('brand-intro-pending');\n    root.classList.add('is-exiting');\n    later(finish,reduced?180:600);\n  };\n  const start=()=>{\n    if(started||finished)return;\n    started=true;\n    requestAnimationFrame(()=>requestAnimationFrame(()=>{\n      if(reduced){\n        root.classList.add('is-logo-lit','is-reveal');\n        later(exit,180);\n        return;\n      }\n      later(()=>root.classList.add('is-logo-lit'),90);\n      later(()=>root.classList.add('is-reveal'),4450);\n      later(exit,5240);\n    }));\n  };\n\n  root.querySelector('[data-brand-skip]')?.addEventListener('click',exit);\n  start();\n})();\n''')

          # 3) Persist the no-flash requirement.
          p = Path('PROJECT_STATE.md')
          state = p.read_text()
          anchor = '- 深色背景中央顯示 `77waxing`；字體使用 Georgia。\n'
          addition = '- 首次進入首頁且本 session 尚未播放動畫時，第一個可見畫面必須直接是深色動畫層；不得先閃出首頁內容再切換到動畫。Intro bootstrap 必須在首頁內容 render 前啟動。\n'
          if addition not in state:
              if anchor not in state:
                  raise SystemExit('PROJECT_STATE intro anchor not found')
              state = state.replace(anchor, addition + anchor, 1)
          p.write_text(state)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/home-warm-intro.js
          grep -q 'brand-intro-pending' index.html
          grep -q 'home-warm-intro.css?v=20260912-1237' index.html
          grep -q '<body><script src="/77-waxing-site/assets/home-warm-intro.js?v=20260912-1237"></script><header' index.html
          ! grep -q "createElement('link')" assets/home-warm-intro.js
          grep -q "sessionStorage.setItem(KEY,'1')" assets/home-warm-intro.js
          grep -q '不得先閃出首頁內容再切換到動畫' PROJECT_STATE.md

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/home-warm-intro.js PROJECT_STATE.md
          git commit -m 'fix: prevent homepage flash before brand intro'
          git push origin main
