name: Fix home service entry once

on:
  push:
    paths:
      - '.github/workflows/fix-home-service-entry-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply homepage and service entry fixes
        run: python3 scripts/fix-home-service-entry-once.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/pages.js
          node --check assets/catalog-dynamic.js
          grep -q '第一次熱蠟，可能也會想問...</a></div>' assets/pages.js
          ! grep -q 'home-faq-section' assets/pages.js
          grep -q '7777waxing video' assets/pages.js
          grep -q '為什麼大家都推薦77waxing？' assets/pages.js
          grep -q 'window.scrollTo({ top: 0, behavior: "auto" })' assets/catalog-dynamic.js
          grep -q '首頁原本底部的「第一次熱蠟，可能也會想問...」FAQ 區塊已移除' PROJECT_STATE.md
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pages.js assets/pages.css assets/catalog-dynamic.js index.html PROJECT_STATE.md
          git commit -m 'feat: update homepage service entry and bottom sections'
          git push origin main
