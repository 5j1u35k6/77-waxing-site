name: Full production cleanup once

on:
  push:
    paths:
      - '.github/workflows/full-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove retired files and legacy code
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app components lib public
          rm -f middleware.ts next-env.d.ts next.config.mjs package.json tsconfig.json .env.example
          rm -f assets/email-footer-77waxing-v19.jpg assets/email-footer-77waxing-v21.jpg assets/email-footer-77waxing-v22.jpg assets/email-footer-77waxing-v23.jpg assets/email-footer-77waxing.jpg
          rm -f assets/admin-ui-fixes.js assets/admin-ux.js assets/admin-login-fix.js assets/firebase-bootstrap.js assets/production-ui.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path,text): Path(path).write_text(text)
          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected text: {label}')
              return text.replace(old,new)

          # Service catalog: catalog-main is the only canonical Firestore document.
          p='assets/service-catalog-store.js'
          s=read(p)
          s=must_replace(s,
            'import { collection, doc, getDoc, getDocs, getFirestore, onSnapshot, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";',
            'import { doc, getDoc, getFirestore, onSnapshot, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";',
            'catalog imports')
          s,n=re.subn(r'  const rawDesc = String\(group\?\.desc \|\| ""\)\.trim\(\);\n  const hiddenLegacyCopy = new Set\(\[.*?\n  \]\);\n','',s,flags=re.S)
          if n!=1: raise SystemExit(f'hiddenLegacyCopy blocks removed: {n}')
          s=must_replace(s,'    desc: hiddenLegacyCopy.has(rawDesc) ? "" : rawDesc,','    desc: String(group?.desc || "").trim(),','legacy copy filter')
          s,n=re.subn(r'\nfunction legacyServiceId\(category, name\) \{.*?\n\}\n\nasync function applyLegacyOverrides\(catalog\) \{.*?\n\}\n','\n',s,flags=re.S)
          if n!=1: raise SystemExit(f'legacy catalog merge blocks removed: {n}')
          s=must_replace(s,'  return applyLegacyOverrides(normalizeCatalog(clone(DEFAULT_CATALOG)));','  return normalizeCatalog(clone(DEFAULT_CATALOG));','loadCatalog fallback')
          s=must_replace(s,'    callback(await applyLegacyOverrides(normalizeCatalog(clone(DEFAULT_CATALOG))));','    callback(normalizeCatalog(clone(DEFAULT_CATALOG)));','watchCatalog fallback')
          write(p,s)

          # firebase-pages is production admin only; remove the retired booking renderer.
          p='assets/firebase-pages.js'
          s=read(p)
          s=must_replace(s,'  signInAnonymously,\n','', 'anonymous auth import')
          s=must_replace(s,'  getDocsFromServer,\n','', 'server docs import')
          s=must_replace(s,'  where,\n','', 'where import')
          s,n=re.subn(r'const SERVICES = .*?(?=const statusText =)', '', s, flags=re.S)
          if n!=1: raise SystemExit(f'old booking constants removed: {n}')
          s,n=re.subn(r'function setupRequired\(.*?(?=function adminLoginMarkup\(\))', '', s, flags=re.S)
          if n!=1: raise SystemExit(f'old booking runtime removed: {n}')
          s=must_replace(s,'<p class="muted">使用 Firebase Authentication 的管理員帳號登入。</p>','<p class="muted">請使用管理員帳號登入。</p>','login copy')
          s=must_replace(s,'<a class="on" href="#dashboard">Dashboard</a>','<a class="on" href="#dashboard">總覽</a>','dashboard label')
          s=must_replace(s,'<a href="#settings">網站設定</a><button class="btn admin-logout" type="button" data-admin-logout>登出</button>','<a href="#settings">網站設定</a><a class="admin-site-link" href="/77-waxing-site/" data-admin-site-link>← 回到網站</a><button class="btn admin-logout" type="button" data-admin-logout>登出</button>','site link')
          s=s.replace('FIRESTORE ADMIN','ADMIN').replace('● Firestore 即時同步','● 即時同步')
          s=s.replace('<p class="muted">資料直接來自 Firestore。待確認會顯示保留中；確認後重疊時段從顧客端隱藏；取消／完成／未到店會釋放鎖定。</p>','')
          s=s.replace('  replacePreviewBanner(root, "正式後台｜Firebase Authentication + Firestore", "ok");\n','')
          s=s.replace('  replacePreviewBanner(root, "管理員登入由 Firebase Authentication 保護；未登入無法讀取顧客或預約資料。", "info");\n','')
          s=s.replace('程式已切換為 GitHub Pages + Firebase 架構，但還需要填入 Firebase Web App 公開設定，並啟用 Authentication / Firestore Rules。','Firebase Web App 設定尚未完成，請確認 Authentication 與 Firestore 設定。')
          s=s.replace('    replacePreviewBanner(root, "請先完成 Firebase Web App 設定；完成前不要刪除 Netlify。", "warning");','    replacePreviewBanner(root, "請先完成 Firebase Web App 設定。", "warning");')
          s=must_replace(s,'  const booking = document.querySelector("#booking");\n  if (booking) mountBooking(booking);\n','', 'mountCurrentPage booking branch')
          write(p,s)

          # Admin routing: only current labels, and render dashboard directly without boot repair scripts.
          p='assets/admin-v2.js'
          s=read(p)
          s=s.replace('"總覽":"dashboard","Dashboard":"dashboard",','"總覽":"dashboard",')
          s=s.replace('"服務管理":"services","服務功能":"services",','"服務功能":"services",')
          s=s.replace('"價格管理":"pricing","價格功能":"pricing",','"價格功能":"pricing",')
          old='const hash=(location.hash||"#dashboard").slice(1);if(["bookings","calendar","customers","services","slots","pricing","settings"].includes(hash))renderView(hash);'
          new='const hash=(location.hash||"#dashboard").slice(1);const allowed=["dashboard","bookings","calendar","customers","services","slots","pricing","settings"];renderView(allowed.includes(hash)?hash:"dashboard");'
          s=must_replace(s,old,new,'admin initial route')
          write(p,s)

          # About menu: remove the retired hard-coded "ensure bust-care exists" fallback.
          p='assets/nav-enhancements.js'
          s=read(p)
          s,n=re.subn(r'\n  function ensureBustCare\(\)\{.*?\n  \}\n','\n',s,flags=re.S)
          if n!=1: raise SystemExit(f'ensureBustCare blocks removed: {n}')
          s=s.replace('  if(!aboutLink){ensureBustCare();return;}','  if(!aboutLink)return;')
          s=s.replace('    ensureBustCare();\n','')
          s=s.replace("  addEventListener('resize',()=>{hide();ensureBustCare()});","  addEventListener('resize',hide);")
          s=s.replace("  new MutationObserver(()=>{ensureBustCare();if(aboutMenu.classList.contains('on'))position()}).observe(nav,{childList:true,subtree:true});","  new MutationObserver(()=>{if(aboutMenu.classList.contains('on'))position()}).observe(nav,{childList:true,subtree:true});")
          s=s.replace('  ensureBustCare();\n','')
          write(p,s)

          # Price row booking already carries category/item in its URL; remove stale localStorage prefill and cache-version query.
          p='assets/price-row-actions.js'
          s=read(p)
          s=s.replace("  const PREFILL_KEY='77waxing-booking-prefill';\n",'')
          s=s.replace("  const BOOKING_CACHE='20260909-1915';\n",'')
          s=s.replace('    return `${B}/booking/?v=${BOOKING_CACHE}#${payload}`;','    return `${B}/booking/#${payload}`;')
          s,n=re.subn(r"  const rememberPrefill=\(category,item\)=>\{.*?\n  \};\n",'',s,flags=re.S)
          if n!=1: raise SystemExit(f'rememberPrefill blocks removed: {n}')
          s=s.replace('        rememberPrefill(category,name);\n','')
          write(p,s)

          # Remove retired scripts from production HTML and give modified core scripts one current cache key.
          for p in ['index.html','booking/index.html','admin/index.html']:
              s=read(p)
              for filename in ['firebase-bootstrap.js','production-ui.js','admin-login-fix.js','admin-ux.js','admin-ui-fixes.js']:
                  s=re.sub(r'<script[^>]+src="[^"]*'+re.escape(filename)+r'[^\"]*"[^>]*></script>','',s)
              s=re.sub(r'(firebase-pages\.js)\?v=[^"\']+',r'\1?v=20260911-clean',s)
              s=re.sub(r'(admin-v2\.js)\?v=[^"\']+',r'\1?v=20260911-clean',s)
              s=re.sub(r'(nav-enhancements\.js)\?v=[^"\']+',r'\1?v=20260911-clean',s)
              s=re.sub(r'(price-row-actions\.js)\?v=[^"\']+',r'\1?v=20260911-clean',s)
              write(p,s)

          # Minimal ignores for the production-only repository.
          Path('.gitignore').write_text('.DS_Store\n*.log\n')
          PY

          cat > README.md <<'EOF'
          # 77waxing｜77美學工作室

          77waxing 正式品牌官網、線上預約、管理後台與 Email 通知系統。

          ## 正式架構

          - GitHub Pages：前台、預約頁、管理後台
          - Firebase Authentication：顧客匿名工作階段與管理員登入
          - Cloud Firestore：預約、時段鎖定、顧客、服務、價格與營運設定
          - Firestore Security Rules：前後台資料權限
          - Google Apps Script：預約 Email 通知

          正式入口：
          - `/`：品牌官網
          - `/booking/`：線上預約
          - `/admin/`：管理後台

          ## 主要資料

          - `bookings`：預約
          - `availabilityLocks`：30 分鐘時段鎖定
          - `customers`：顧客資料
          - `customerPhoneIndex`：手機索引
          - `services/catalog-main`：正式服務／價格 catalog
          - `settings/general`：網站與預約設定
          - `settings/availability_YYYY-MM-DD`：店家手動封鎖時段
          - `admins/{uid}`：管理員權限

          ## 專案結構

          - `index.html` + `assets/`：正式前台
          - `booking/index.html`：正式預約入口
          - `admin/index.html`：正式後台入口
          - `firebase/`：Firestore rules / indexes
          - `apps-script/Code.gs`：Email 通知
          - `PROJECT_STATE.md`：目前不可回歸的產品規則

          本 repository 只保留目前正式環境需要的程式與資產；已不使用的 Next.js/server 舊架構、舊 renderer、相容補丁與歷史版本資產已移除。
          EOF

          cat > PROJECT_STATE.md <<'EOF'
          # 77waxing｜目前正式基準

          > 修改前先閱讀本檔。這裡只記錄「現在仍有效」的產品規則，不保存舊版實作歷史。

          ## 架構

          - 正式站為 GitHub Pages 靜態前台：`/`、`/booking/`、`/admin/`。
          - Firebase Authentication + Cloud Firestore 是正式資料層。
          - Google Apps Script `apps-script/Code.gs` 負責預約 Email。
          - 服務／價目唯一公開 renderer 為 `assets/catalog-dynamic.js`；資料來源為 `services/catalog-main`，並使用瀏覽器快取後再背景同步 Firestore。

          ## Email

          - 寄件顯示名稱為 `77waxing`，店家信箱為 `77waxing.mail@gmail.com`。
          - 信件 footer 必須在 Gmail 正文內顯示，不使用 CID/inlineImages 附件 MIME。
          - 正式 footer 使用公開 HTTPS 圖片 `assets/email-footer-77waxing-v25.jpg`，整張可點擊回官方網站。

          ## 預約前台

          - 最早可約日期為台北時區的「明天」；今天與過去日期不可選。
          - 每 30 分鐘一格；網站設定最早時間可從 `08:00` 開始。
          - `held` 顯示黃色且不可點；已確認預約與店家手動封鎖顯示灰色且不可點，時段格不顯示狀態說明文字。
          - 服務時間依 catalog 個別項目設定，結束時間依實際 duration 計算；整理緩衝仍納入時段鎖定。
          - 顧客選好的時段若之後被占用／封鎖，下一步或送出前必須要求重選。
          - 服務頁與價目頁不得先顯示舊資料再覆蓋；首次無快取時只顯示中性載入狀態。

          ## 管理後台

          - 側欄固定：`總覽 → 預約管理 → 預約行事曆 → 顧客資料 → 服務功能 → 時段功能 → 價格功能 → 網站設定`。
          - 預約時間必須顯示「開始–服務結束」，例如 `11:00–12:30`。
          - 每筆預約必須保留永久「刪除」；永久刪除同步刪除該 booking 的 availability locks。取消與永久刪除是不同操作。
          - 預約管理的顧客姓名可點擊，顯示：姓名／電話／性別、Email／LINE ID、過去預約紀錄。
          - 客別只顯示 `新` 或 `舊`。
          - 「概論 > 待確認」只計算 `pending_confirmation`；「營運總覽 > 待處理」包含待確認與待付款。
          - 時段功能只顯示單一自訂日期按鈕；點擊後開小型月曆，選日後關閉。今天與過去日期不可選。
          - 店家手動封鎖寫入 `settings/availability_YYYY-MM-DD.blockedTimes`；解除店家封鎖不得刪除顧客 booking lock。

          ## 首頁動畫

          - 深色背景中央顯示 `77waxing`；字體使用 Georgia。
          - `77` 為 `#C5A070`，`waxing` 在深色背景為 `#F9F6F0`。
          - 左到右掃亮約 4.28 秒；`g` 下伸筆畫不可被裁切。
          - 桌機與手機字標／掃光維持收斂尺寸，白色斜線不可明顯超出字標範圍。
          - 掃亮完成後背景才漸亮成首頁；每個 browser session 播放一次，保留略過與 reduced-motion。

          ## 目前仍必要的保護／同步層

          - `admin-critical-preserve.js`：時間區間與永久刪除最後保護。
          - `admin-time-range.js`：預約時間區間顯示。
          - `admin-record-actions.js`：預約／顧客刪除操作。
          - `admin-functions.js`：顧客快速資料與時段功能資料操作。
          - `admin-slot-calendar.js`：時段功能日期彈窗。
          - `booking-slot-status.js`：前端黃色／灰色時段狀態同步。
          - `nav-service-catalog-sync.js`：預約頁服務選單同步 catalog。

          ## 修改規則

          1. 不新增第二套 renderer 或第二套同功能資料來源。
          2. 不用 DOM 位置硬改側欄文字；功能名稱由正式來源直接產生。
          3. 不恢復已移除的 demo、legacy、preview、Next.js/server 相容程式。
          4. 每次更新後至少檢查 JavaScript syntax、靜態資產引用與 GitHub Pages deploy。
          5. 新增不可回歸需求時，更新本檔，只寫「目前狀態」，不堆疊舊版本歷史。
          EOF

      - name: Validate cleaned production tree
        shell: bash
        run: |
          set -euo pipefail
          for retired in app components lib public middleware.ts next-env.d.ts next.config.mjs package.json tsconfig.json .env.example assets/admin-ui-fixes.js assets/admin-ux.js assets/admin-login-fix.js assets/firebase-bootstrap.js assets/production-ui.js; do
            test ! -e "$retired" || { echo "retired path still exists: $retired"; exit 1; }
          done
          ! grep -R -n -E 'catalog-v1\.js|catalog-copy-v1\.js|admin-ui-fixes\.js|admin-ux\.js|admin-login-fix\.js|firebase-bootstrap\.js|production-ui\.js|Legacy Next|Netlify|applyLegacyOverrides|legacyServiceId' . --exclude-dir=.git --exclude='full-cleanup-once.yml' || exit 1
          for file in assets/*.js; do
            if grep -Eq '^[[:space:]]*(import|export)[[:space:]]' "$file"; then
              temp="/tmp/$(basename "${file%.js}").mjs"
              cp "$file" "$temp"
              node --check "$temp"
            else
              node --check "$file"
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          missing=[]
          for html in [Path('index.html'),Path('booking/index.html'),Path('admin/index.html')]:
              text=html.read_text()
              for ref in re.findall(r'(?:src|href)=["\']([^"\']+)["\']',text):
                  if '/assets/' not in ref and not ref.startswith('../assets/'):
                      continue
                  clean=ref.split('?',1)[0]
                  if clean.startswith('/77-waxing-site/'):
                      target=Path(clean[len('/77-waxing-site/'):])
                  elif clean.startswith('../'):
                      target=(html.parent/clean).resolve().relative_to(Path.cwd().resolve())
                  else:
                      target=html.parent/clean
                  if not target.exists(): missing.append(f'{html}: {ref} -> {target}')
          if missing:
              print('\n'.join(missing),file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Commit production-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No cleanup changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove retired architectures and legacy runtime code'
          git push origin HEAD:main
