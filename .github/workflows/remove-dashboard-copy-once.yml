name: Remove dashboard helper copy once

on:
  push:
    paths:
      - '.github/workflows/remove-dashboard-copy-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove dashboard helper text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dashboard = Path('assets/admin-dashboard.js')
          text = dashboard.read_text()
          replacements = [
              ('<div><span class="tag">BUSINESS PULSE</span><h3>營運總覽</h3><p class="muted">總覽版型固定存在；有資料時填入趨勢，尚無資料時保留同一個位置顯示 0 與空白狀態。</p></div>', '<div><span class="tag">BUSINESS PULSE</span><h3>營運總覽</h3></div>'),
              ('        <p class="muted">只有需要人工處理的數量，不在總覽重複列出整張預約表。</p>\n', ''),
              ('        ${weekTotal===0?`<p class="dashboard-inline-empty">未來 7 天目前沒有預約，圖表會保留在原位。</p>`:\'\'}\n', ''),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing dashboard copy anchor: {old[:60]}')
              text = text.replace(old, new, 1)
          dashboard.write_text(text)

          admin = Path('admin/index.html')
          html = admin.read_text()
          old = 'admin-dashboard.js?v=20260909-1735'
          if old not in html:
              raise SystemExit('admin dashboard cache anchor not found')
          html = html.replace(old, 'admin-dashboard.js?v=20260911-1805', 1)
          admin.write_text(html)

          state = Path('PROJECT_STATE.md')
          state_text = state.read_text()
          rule = '- 總覽不顯示版型／資料狀態等系統說明文案；保留指標與圖表本身，空資料直接以 0 或空圖表呈現。\n'
          anchor = '- 「概論 > 待確認」只計算 `pending_confirmation`；「營運總覽 > 待處理」包含待確認與待付款。\n'
          if rule not in state_text:
              if anchor not in state_text:
                  raise SystemExit('PROJECT_STATE dashboard anchor not found')
              state_text = state_text.replace(anchor, anchor + rule, 1)
          state.write_text(state_text)
          PY

      - name: Validate cleanup
        shell: bash
        run: |
          set -euo pipefail
          cp assets/admin-dashboard.js /tmp/admin-dashboard.mjs
          node --check /tmp/admin-dashboard.mjs
          ! grep -q '總覽版型固定存在' assets/admin-dashboard.js
          ! grep -q '只有需要人工處理的數量' assets/admin-dashboard.js
          ! grep -q '未來 7 天目前沒有預約' assets/admin-dashboard.js
          grep -q 'admin-dashboard.js?v=20260911-1805' admin/index.html

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/admin-dashboard.js admin/index.html PROJECT_STATE.md
          git commit -m 'fix: remove dashboard helper copy'
          git push origin HEAD:main
