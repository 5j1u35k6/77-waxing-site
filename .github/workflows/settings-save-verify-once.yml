name: Add settings save verification once

on:
  push:
    paths:
      - '.github/workflows/settings-save-verify-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add server read-back verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          core = Path('assets/admin-core.js')
          text = core.read_text()

          old_import = 'import { collection, doc, getDoc, getFirestore, onSnapshot, orderBy, query, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";'
          new_import = 'import { collection, doc, getDoc, getDocFromServer, getFirestore, onSnapshot, orderBy, query, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";'
          if old_import not in text:
              raise SystemExit('admin-core firestore import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_handler = '''  w.querySelector("[data-save-settings]").onclick=async()=>{const button=w.querySelector("[data-save-settings]");const msg=w.querySelector("[data-settings-message]");const a=w.querySelector('[name="bookingStartTime"]').value,b=w.querySelector('[name="bookingEndTime"]').value;if(a>b){msg.textContent="最晚開始時間不可早於最早時間。";return;}button.disabled=true;msg.textContent="儲存中…";try{settings={bookingEnabled:w.querySelector('[name="bookingEnabled"]').checked,bookingStartTime:a,bookingEndTime:b,maxAdvanceDays:Number(w.querySelector('[name="maxAdvanceDays"]').value||60),bookingNotice:w.querySelector('[name="bookingNotice"]').value.trim()};await setDoc(doc(db,"settings","general"),{...settings,updatedAt:serverTimestamp()},{merge:true});msg.textContent="已儲存，前台會套用最新設定。";}catch(e){console.error(e);msg.textContent="儲存失敗，請稍後再試。";}finally{button.disabled=false;}};'''
          new_handler = '''  w.querySelector("[data-save-settings]").onclick=async()=>{
    const button=w.querySelector("[data-save-settings]");
    const msg=w.querySelector("[data-settings-message]");
    const a=w.querySelector('[name="bookingStartTime"]').value;
    const b=w.querySelector('[name="bookingEndTime"]').value;
    if(a>b){msg.textContent="最晚開始時間不可早於最早時間。";return;}
    const expected={
      bookingEnabled:w.querySelector('[name="bookingEnabled"]').checked,
      bookingStartTime:a,
      bookingEndTime:b,
      maxAdvanceDays:Number(w.querySelector('[name="maxAdvanceDays"]').value||60),
      bookingNotice:w.querySelector('[name="bookingNotice"]').value.trim()
    };
    button.disabled=true;
    msg.textContent="儲存中…";
    try{
      const settingsRef=doc(db,"settings","general");
      await setDoc(settingsRef,{...expected,updatedAt:serverTimestamp()},{merge:true});
      msg.textContent="確認儲存結果中…";
      const verifySnap=await getDocFromServer(settingsRef);
      if(!verifySnap.exists())throw new Error("settings document missing after save");
      const saved=verifySnap.data();
      const verified=saved.bookingEnabled===expected.bookingEnabled
        && String(saved.bookingStartTime||"")===expected.bookingStartTime
        && String(saved.bookingEndTime||"")===expected.bookingEndTime
        && Number(saved.maxAdvanceDays)===expected.maxAdvanceDays
        && String(saved.bookingNotice||"")===expected.bookingNotice;
      if(!verified)throw new Error("settings verification mismatch");
      settings={...saved};
      msg.textContent="已儲存並確認，前台會套用最新設定。";
    }catch(e){
      console.error("settings save/verify failed",e);
      msg.textContent="儲存或驗證失敗，請稍後再試。";
    }finally{
      button.disabled=false;
    }
  };'''
          if old_handler not in text:
              raise SystemExit('settings save handler anchor not found')
          text = text.replace(old_handler, new_handler, 1)
          core.write_text(text)

          admin = Path('admin/index.html')
          html = admin.read_text()
          old_cache = 'admin-core.js?v=20260911-clean'
          if old_cache not in html:
              raise SystemExit('admin-core cache anchor not found')
          html = html.replace(old_cache, 'admin-core.js?v=20260911-settings-verify', 1)
          admin.write_text(html)

          state = Path('PROJECT_STATE.md')
          state_text = state.read_text()
          anchor = '- 編輯預約彈窗底部不得使用深色整塊背景；只保留右下角的「取消／儲存修改」按鈕，取消文字使用紅色。\n'
          rule = '- 「儲存網站設定」寫入 `settings/general` 後，必須用 Firestore server read-back 驗證主要欄位完全一致；只有驗證成功才能顯示已儲存。\n'
          if rule not in state_text:
              if anchor not in state_text:
                  raise SystemExit('PROJECT_STATE admin anchor not found')
              state_text = state_text.replace(anchor, anchor + rule, 1)
          state.write_text(state_text)
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          cp assets/admin-core.js /tmp/admin-core.mjs
          node --check /tmp/admin-core.mjs
          grep -q 'getDocFromServer' assets/admin-core.js
          grep -q '確認儲存結果中' assets/admin-core.js
          grep -q '已儲存並確認' assets/admin-core.js
          grep -q 'admin-core.js?v=20260911-settings-verify' admin/index.html

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/admin-core.js admin/index.html PROJECT_STATE.md
          git commit -m 'fix: verify website settings after save'
          git push origin HEAD:main

# trigger
