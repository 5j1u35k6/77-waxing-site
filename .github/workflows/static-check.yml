name: Production static check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check asset JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/*.js; do
            if grep -Eq '^[[:space:]]*(import|export)[[:space:]]' "$file"; then
              temp="/tmp/$(basename "${file%.js}")-asset.mjs"
              cp "$file" "$temp"
              node --check "$temp"
            else
              node --check "$file"
            fi
          done
      - name: Check shop frontend syntax
        shell: bash
        run: |
          set -euo pipefail
          cp shop/app.js /tmp/77waxing-shop-app.mjs
          node --check /tmp/77waxing-shop-app.mjs
      - name: Check shop admin syntax
        shell: bash
        run: |
          set -euo pipefail
          cp shop/admin.js /tmp/77waxing-shop-admin.mjs
          node --check /tmp/77waxing-shop-admin.mjs
      - name: Check Apps Script syntax
        shell: bash
        run: |
          set -euo pipefail
          cp apps-script/Code.gs /tmp/apps-script-code.js
          node --check /tmp/apps-script-code.js
      - name: Check admin Firebase bootstrap
        shell: bash
        run: |
          set -euo pipefail
          file='assets/admin-firebase.js'
          grep -q '^let auth = null;' "$file"
          grep -q '^let db = null;' "$file"
          grep -q '^let adminUnsubscribe = null;' "$file"
          grep -q '^let authPersistenceReady = Promise.resolve();' "$file"
          grep -q 'initializeApp(firebaseConfig)' "$file"
          grep -q 'auth = getAuth(app)' "$file"
          grep -q 'db = getFirestore(app)' "$file"
          grep -q 'setPersistence(auth, browserLocalPersistence)' "$file"
          grep -q 'return snapshot.exists();' "$file"
      - name: Check public and admin Firebase auth isolation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PUBLIC_FIREBASE_APP_NAME = "77waxing-public"' assets/public-firebase.js
          grep -q 'ADMIN_AUTH_REQUIRED' assets/service-catalog-store.js
          grep -q 'getPublicFirebase' assets/booking-core.js
          grep -q 'getPublicFirebase' assets/runtime-settings.js
          grep -q 'getPublicFirebase' assets/booking-slot-status.js
          grep -q 'isAdminContext' assets/email-dispatch.js
          ! grep -q 'initializeApp(firebaseConfig);' assets/booking-core.js
      - name: Check service catalog ordering integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function moveEntry' assets/admin-service-catalog.js
          grep -q 'data-move-category' assets/admin-service-catalog.js
          grep -q 'data-move-group' assets/admin-service-catalog.js
          grep -q 'data-move-item' assets/admin-service-catalog.js
          grep -q 'catalog-order-actions' assets/admin-service-catalog.css
          grep -q 'function serviceSwitcher' assets/catalog-dynamic.js
          grep -q 'data-price-jump' assets/catalog-dynamic.js
          grep -q 'const services=catalog.filter' assets/nav-service-catalog-sync.js
          grep -q 'const source = publicCatalog(await loadCatalog())' assets/booking-core.js
      - name: Check shop Firebase migration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"default": "waxing-86909"' .firebaserc
          grep -q 'getPublicFirebase' shop/app.js
          grep -q 'firebaseConfig' shop/admin.js
          grep -q 'admins' shop/admin.js
          grep -q 'runTransaction' shop/admin.js
          grep -q 'shopProducts' firebase/firestore.rules
          grep -q 'shopOrders' firebase/firestore.rules
          grep -q 'shopMessages' firebase/firestore.rules
          grep -q 'shopSettings' firebase/firestore.rules
          grep -q 'shopAuditLogs' firebase/firestore.rules
          grep -q 'kind: "shop_order"' shop/app.js
          grep -q 'kind: "shop_order"' shop/admin.js
          grep -q 'handleShopOrderPost_' apps-script/Code.gs
          ! grep -Rni -E 'zizhen-sweets|zizhen-desserts|子珍甜點|Zizhen Sweets' shop --include='*.html' --include='*.js' --include='*.css' || exit 1
      - name: Check static asset references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          missing=[]
          html_files=[Path('index.html'),Path('booking/index.html'),Path('admin/index.html'),Path('shop/index.html'),Path('shop/admin.html'),Path('shop/policies.html')]
          for html in html_files:
              text=html.read_text()
              for ref in re.findall(r'(?:src|href)=["\']([^"\']+)["\']',text):
                  clean=ref.split('?',1)[0]
                  if clean.startswith(('http://','https://','mailto:','#','javascript:')):
                      continue
                  if clean.startswith('/77-waxing-site/'):
                      target=Path(clean[len('/77-waxing-site/'):])
                  elif clean.startswith('../') or clean.startswith('./'):
                      target=(html.parent/clean).resolve().relative_to(Path.cwd().resolve())
                  elif '/assets/' in clean:
                      target=html.parent/clean
                  else:
                      continue
                  if not target.exists(): missing.append(f'{html}: {ref} -> {target}')
          if missing:
              print('\n'.join(missing),file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Reject retired runtime references
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'catalog-v1\.js|catalog-copy-v1\.js|admin-ui-fixes\.js|admin-ux\.js|nav-v4\.(js|css)|booking-v3\.(js|css)|admin-v2\.(js|css)|admin-dashboard-v3\.(js|css)|catalog-v1\.css|footer-v1\.css|firebase-pages\.js' index.html booking admin assets shop --include='*.html' --include='*.js' --include='*.css' || exit 1
