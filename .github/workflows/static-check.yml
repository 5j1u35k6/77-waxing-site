name: Production static check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/*.js; do
            if grep -Eq '^[[:space:]]*(import|export)[[:space:]]' "$file"; then
              temp="/tmp/$(basename "${file%.js}").mjs"
              cp "$file" "$temp"
              node --check "$temp"
            else
              node --check "$file"
            fi
          done
      - name: Check static asset references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          missing=[]
          for html in [Path('index.html'),Path('booking/index.html'),Path('admin/index.html')]:
              text=html.read_text()
              for ref in re.findall(r'(?:src|href)=["\']([^"\']+)["\']',text):
                  if '/assets/' not in ref and not ref.startswith('../assets/'):
                      continue
                  clean=ref.split('?',1)[0]
                  if clean.startswith('/77-waxing-site/'):
                      target=Path(clean[len('/77-waxing-site/'):])
                  elif clean.startswith('../'):
                      target=(html.parent/clean).resolve().relative_to(Path.cwd().resolve())
                  else:
                      target=html.parent/clean
                  if not target.exists(): missing.append(f'{html}: {ref} -> {target}')
          if missing:
              print('\n'.join(missing),file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Reject retired runtime references
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'catalog-v1\.js|catalog-copy-v1\.js|admin-ui-fixes\.js|admin-ux\.js' index.html booking admin assets --include='*.html' --include='*.js' || exit 1
