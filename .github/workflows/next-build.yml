name: Next.js build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check GitHub Pages JavaScript
        run: |
          node --check assets/pages.js
          node --check assets/nav-v4.js
          node --check assets/catalog-v1.js
          node --check assets/catalog-scroll-fix.js
          node --check assets/price-row-actions.js
          node --check assets/firebase-bootstrap.js
          cp assets/firebase-pages.js /tmp/firebase-pages.mjs
          node --check /tmp/firebase-pages.mjs
          cp assets/booking-v3.js /tmp/booking-v3.mjs
          node --check /tmp/booking-v3.mjs
          node --check assets/booking-prefill-direct.js
          node --check assets/booking-display-fix.js
          cp assets/email-dispatch.js /tmp/email-dispatch.mjs
          node --check /tmp/email-dispatch.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js
        run: npm run build
