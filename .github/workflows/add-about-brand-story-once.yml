name: Add about brand story once

on:
  push:
    paths:
      - '.github/workflows/add-about-brand-story-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply brand story patch
        run: python3 scripts/apply-about-brand-story.py
      - name: Validate brand story page
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/pages.js
          grep -q '77waxing故事' assets/pages.js
          grep -q 'about-story.css?v=20260912-1410' index.html
          grep -q '正式品牌故事頁' PROJECT_STATE.md
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pages.js assets/about-story.css index.html PROJECT_STATE.md .github/workflows/static-check.yml
          git commit -m 'feat: build 77waxing brand story page'
          git push origin main
