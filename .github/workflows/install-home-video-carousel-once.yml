name: Install home video carousel once

on:
  push:
    paths:
      - '.github/workflows/install-home-video-carousel-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install Instagram carousel assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          css_tag = '<link rel="stylesheet" href="/77-waxing-site/assets/home-video-carousel.css?v=20260912-1538">'
          js_tag = '<script src="/77-waxing-site/assets/home-video-carousel.js?v=20260912-1538"></script>'
          if css_tag not in text:
              needle = '<link rel="stylesheet" href="/77-waxing-site/assets/pages.css?v=20260912-1524">'
              if needle not in text:
                  raise SystemExit('pages.css tag not found')
              text = text.replace(needle, needle + css_tag, 1)
          if js_tag not in text:
              needle = '<script src="/77-waxing-site/assets/pages.js?v=20260912-1524"></script>'
              if needle not in text:
                  raise SystemExit('pages.js tag not found')
              text = text.replace(needle, needle + js_tag, 1)
          index.write_text(text)

          state = Path('PROJECT_STATE.md')
          s = state.read_text()
          line = '- `7777waxing video` 已串接使用者提供的 16 個 @77waxing Instagram 貼文連結，依使用者提供順序固定為 01–16；正式前台以 Instagram 官方 embed iframe 播放。左側分類在尚未取得／確認內容語意分類前不得自行猜測服務類別，先使用中性的 `全部影片`、`01—04`、`05—08`、`09—12`、`13—16` 分組；之後若使用者指定實際分類，再改成內容分類。'
          if line not in s:
              anchor = '- 首頁 `7777waxing video` 區塊的正式呈現方式：桌機採左側影片分類／右側 3D perspective 卡片輪播；中央目前影片最大且正面，左右相鄰影片縮小、後退並帶透視角度形成疊卡效果，底部提供左右切換與分頁點；可滑動／拖曳切換，手機改為適合觸控的單列輪播。此視覺參考使用者 2026-09-12 提供的範例圖，但網站不得顯示範例圖中的 source code 區塊。實際影片來源待使用者提供 Instagram Reel 連結後串接。'
              if anchor in s:
                  s = s.replace(anchor, anchor + '\n' + line, 1)
              else:
                  s += '\n' + line + '\n'
              state.write_text(s)
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/home-video-carousel.js
          test -s assets/home-video-carousel.css
          grep -q 'home-video-carousel.css?v=20260912-1538' index.html
          grep -q 'home-video-carousel.js?v=20260912-1538' index.html
          grep -q 'DUGhMGBE8sE' assets/home-video-carousel.js
          grep -q 'DGNabU8zg-R' assets/home-video-carousel.js
          grep -q '16 個 @77waxing Instagram' PROJECT_STATE.md
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html PROJECT_STATE.md
          git commit -m 'feat: connect homepage Instagram video carousel'
          git push origin main
