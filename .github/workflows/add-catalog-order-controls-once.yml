name: Add catalog ordering controls once

on:
  push:
    paths:
      - '.github/workflows/add-catalog-order-controls-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add catalog move controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          VERSION = '20260912-1350'

          p = Path('assets/admin-service-catalog.js')
          text = p.read_text()
          old = 'const VERSION = "20260909-2035";'
          if old not in text:
              raise SystemExit('catalog admin version anchor not found')
          text = text.replace(old, f'const VERSION = "{VERSION}";', 1)

          anchor = 'const itemAt = (group, id) => group?.items?.find((item) => item.id === id);\n'
          helper = '''\nfunction moveEntry(list, predicate, direction) {\n  if (!Array.isArray(list) || ![-1, 1].includes(direction)) return false;\n  const from = list.findIndex(predicate);\n  const to = from + direction;\n  if (from < 0 || to < 0 || to >= list.length) return false;\n  const [entry] = list.splice(from, 1);\n  list.splice(to, 0, entry);\n  return true;\n}\n'''
          if 'function moveEntry(' not in text:
              if anchor not in text:
                  raise SystemExit('move helper anchor not found')
              text = text.replace(anchor, anchor + helper, 1)

          replacements = [
              (
                  '${catalog.map((category) => `<section class="catalog-category-card"',
                  '${catalog.map((category, categoryIndex) => `<section class="catalog-category-card"'
              ),
              (
                  '${category.groups.map((group) => `<div class="catalog-group-card"',
                  '${category.groups.map((group, groupIndex) => `<div class="catalog-group-card"'
              ),
              (
                  '${group.items.length ? group.items.map((item) => `<div class="catalog-item-row"',
                  '${group.items.length ? group.items.map((item, itemIndex) => `<div class="catalog-item-row"'
              ),
              (
                  '<div class="catalog-category-actions"><label class="catalog-toggle">',
                  '<div class="catalog-category-actions"><span class="catalog-order-actions" aria-label="分類排序"><button class="catalog-mini-btn" type="button" data-move-category="-1" title="上移分類" ${categoryIndex === 0 ? "disabled" : ""}>↑ 上移</button><button class="catalog-mini-btn" type="button" data-move-category="1" title="下移分類" ${categoryIndex === catalog.length - 1 ? "disabled" : ""}>↓ 下移</button></span><label class="catalog-toggle">'
              ),
              (
                  '<div class="catalog-group-actions"><button class="catalog-mini-btn" type="button" data-add-item>',
                  '<div class="catalog-group-actions"><span class="catalog-order-actions" aria-label="區塊排序"><button class="catalog-mini-btn" type="button" data-move-group="-1" title="上移區塊" ${groupIndex === 0 ? "disabled" : ""}>↑ 上移</button><button class="catalog-mini-btn" type="button" data-move-group="1" title="下移區塊" ${groupIndex === category.groups.length - 1 ? "disabled" : ""}>↓ 下移</button></span><button class="catalog-mini-btn" type="button" data-add-item>'
              ),
              (
                  '<div class="catalog-item-actions"><label class="catalog-toggle">',
                  '<div class="catalog-item-actions"><span class="catalog-order-actions" aria-label="項目排序"><button class="catalog-mini-btn" type="button" data-move-item="-1" title="上移項目" ${itemIndex === 0 ? "disabled" : ""}>↑</button><button class="catalog-mini-btn" type="button" data-move-item="1" title="下移項目" ${itemIndex === group.items.length - 1 ? "disabled" : ""}>↓</button></span><label class="catalog-toggle">'
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'catalog markup anchor not found: {old[:70]}')
              text = text.replace(old, new, 1)

          category_anchor = '''  if (button.matches("[data-edit-category]")) {\n'''
          category_handler = '''  if (button.matches("[data-move-category]")) {\n    const direction = Number(button.dataset.moveCategory);\n    if (![-1, 1].includes(direction)) return;\n    return commitChange((next) => moveEntry(next, (category) => category.key === key, direction), direction < 0 ? "正在上移服務分類…" : "正在下移服務分類…");\n  }\n\n'''
          if category_handler not in text:
              if category_anchor not in text:
                  raise SystemExit('category move handler anchor not found')
              text = text.replace(category_anchor, category_handler + category_anchor, 1)

          group_anchor = '''  if (button.matches("[data-delete-group]")) {\n'''
          group_handlers = '''  if (button.matches("[data-move-group]")) {\n    const direction = Number(button.dataset.moveGroup);\n    if (![-1, 1].includes(direction)) return;\n    return commitChange((next) => moveEntry(categoryAt(key, next).groups, (group) => group.id === groupId, direction), direction < 0 ? "正在上移服務區塊…" : "正在下移服務區塊…");\n  }\n\n  if (button.matches("[data-move-item]")) {\n    const direction = Number(button.dataset.moveItem);\n    if (!itemId || ![-1, 1].includes(direction)) return;\n    return commitChange((next) => moveEntry(groupAt(categoryAt(key, next), groupId).items, (item) => item.id === itemId, direction), direction < 0 ? "正在上移服務項目…" : "正在下移服務項目…");\n  }\n\n'''
          if group_handlers not in text:
              if group_anchor not in text:
                  raise SystemExit('group move handler anchor not found')
              text = text.replace(group_anchor, group_handlers + group_anchor, 1)

          p.write_text(text)

          p = Path('assets/admin-service-catalog.css')
          css = p.read_text()
          if '.catalog-order-actions{' not in css:
              marker = '@media(max-width:800px)'
              block = '.catalog-order-actions{display:inline-flex;gap:4px;align-items:center}.catalog-order-actions .catalog-mini-btn{padding:7px 9px;white-space:nowrap}.catalog-mini-btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}\n'
              if marker not in css:
                  raise SystemExit('catalog css media anchor not found')
              css = css.replace(marker, block + marker, 1)
          p.write_text(css)

          p = Path('admin/index.html')
          html = p.read_text()
          html = html.replace('admin-service-catalog.css?v=20260909-2025', f'admin-service-catalog.css?v={VERSION}')
          html = html.replace('admin-service-catalog.js?v=20260912-1330', f'admin-service-catalog.js?v={VERSION}')
          if f'admin-service-catalog.css?v={VERSION}' not in html or f'admin-service-catalog.js?v={VERSION}' not in html:
              raise SystemExit('admin cache bust update failed')
          p.write_text(html)

          p = Path('PROJECT_STATE.md')
          state = p.read_text()
          anchor = '- 「儲存網站設定」寫入 `settings/general` 後，必須用 Firestore server read-back 驗證主要欄位完全一致；只有驗證成功才能顯示已儲存。\n'
          addition = '- 服務管理必須可對「服務分類（母項目）／分類內區塊／區塊內服務項目（次項目）」逐層上移、下移；排序直接儲存在 `services/catalog-main.categories` 陣列順序，並同步決定前端服務選單、服務頁置頂切換標籤、價目表分類／內容與預約服務選項順序。\n'
          if addition not in state:
              if anchor not in state:
                  raise SystemExit('PROJECT_STATE admin anchor not found')
              state = state.replace(anchor, anchor + addition, 1)
          p.write_text(state)
          PY

      - name: Validate catalog ordering update
        shell: bash
        run: |
          set -euo pipefail
          cp assets/admin-service-catalog.js /tmp/admin-service-catalog.mjs
          node --check /tmp/admin-service-catalog.mjs
          grep -q 'data-move-category' assets/admin-service-catalog.js
          grep -q 'data-move-group' assets/admin-service-catalog.js
          grep -q 'data-move-item' assets/admin-service-catalog.js
          grep -q 'function moveEntry' assets/admin-service-catalog.js
          grep -q 'catalog-order-actions' assets/admin-service-catalog.css
          grep -q 'admin-service-catalog.js?v=20260912-1350' admin/index.html
          grep -q '逐層上移、下移' PROJECT_STATE.md

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/admin-service-catalog.js assets/admin-service-catalog.css admin/index.html PROJECT_STATE.md
          git commit -m 'feat: add service catalog ordering controls'
          git push origin main
