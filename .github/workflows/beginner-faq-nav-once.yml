name: Apply beginner FAQ and navigation update once

on:
  push:
    paths:
      - '.github/workflows/beginner-faq-nav-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/beginner_patch.py
      - name: Validate
        run: |
          node --check assets/pages.js
          node --check assets/nav.js
          grep -q 'home-faq-section' assets/pages.js
          grep -q '小白小白' assets/nav.js
          grep -q '第一次熱蠟，可能也會想問...' assets/pages.js
          grep -q 'beginner-highlight' assets/beginner.css
          grep -q 'pages.js?v=20260911-1922' index.html
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pages.js assets/pages.css assets/beginner.css assets/nav.js assets/nav.css index.html PROJECT_STATE.md
          git commit -m 'feat: refine beginner FAQ and About navigation'
          git push origin HEAD:main
