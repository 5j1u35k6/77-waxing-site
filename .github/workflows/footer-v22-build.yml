name: Build email footer v22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/footer-v22-build.yml'

permissions:
  contents: write

jobs:
  build-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image and font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-core
          python -m pip install --disable-pip-version-check pillow opencv-python-headless

      - name: Build high-DPI footer from verified v21
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import cv2
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          src_path = Path('assets/email-footer-77waxing-v21.jpg')
          out_path = Path('assets/email-footer-77waxing-v22.jpg')
          base = Image.open(src_path).convert('RGB')
          if base.size != (520, 92):
              raise SystemExit(f'Unexpected v21 size: {base.size}')

          scale = 3
          width, height = base.width * scale, base.height * scale

          # Improve edge definition before exporting a 3x-density asset.
          base = base.filter(ImageFilter.UnsharpMask(radius=0.65, percent=145, threshold=2))
          up = base.resize((width, height), Image.Resampling.LANCZOS)
          up = up.filter(ImageFilter.UnsharpMask(radius=0.75, percent=75, threshold=2))

          # Remove the old tiny top-right website label without touching the composition.
          rgb = np.array(up)
          mask = np.zeros((height, width), dtype=np.uint8)
          cv2.rectangle(mask, (434*scale, 4*scale), (518*scale, 20*scale), 255, -1)
          bgr = cv2.cvtColor(rgb, cv2.COLOR_RGB2BGR)
          clean = cv2.inpaint(bgr, mask, 7, cv2.INPAINT_TELEA)
          canvas = Image.fromarray(cv2.cvtColor(clean, cv2.COLOR_BGR2RGB))
          draw = ImageDraw.Draw(canvas)

          panel = (45, 40, 37)
          separator = (103, 92, 81)
          gold = (201, 164, 109)
          cream = (246, 239, 230)
          cream2 = (225, 216, 205)

          serif_path = subprocess.check_output(
              ['fc-match', '-f', '%{file}', 'Noto Serif'], text=True
          ).strip()
          cjk_path = subprocess.check_output(
              ['fc-match', '-f', '%{file}', 'Noto Sans CJK TC'], text=True
          ).strip()
          if not serif_path or not cjk_path:
              raise SystemExit('Required Noto fonts not found')

          # Re-render the successful v21 left panel at 3x resolution.
          left_w = 158 * scale
          draw.rectangle([0, 0, left_w, height], fill=panel)
          draw.rectangle([left_w-2*scale, 0, left_w, height], fill=separator)

          logo_font = ImageFont.truetype(serif_path, 23*scale)
          logo_x, logo_y = 33*scale, 10*scale
          draw.text((logo_x, logo_y), '77', font=logo_font, fill=gold)
          box = draw.textbbox((logo_x, logo_y), '77', font=logo_font)
          draw.text((box[2]-2*scale, logo_y), 'waxing', font=logo_font, fill=cream)

          studio_font = ImageFont.truetype(cjk_path, 9*scale)
          service_font = ImageFont.truetype(cjk_path, 9*scale)
          draw.text((47*scale, 40*scale), '77美學工作室', font=studio_font, fill=cream)
          draw.text((42*scale, 64*scale), '基隆・預約制美學服務', font=service_font, fill=cream2)

          # Re-render the address strip so it stays crisp in Gmail.
          draw.rectangle([164*scale, 64*scale, 334*scale, 89*scale], fill=panel)
          addr_font = ImageFont.truetype(cjk_path, 10*scale)
          draw.ellipse([168*scale, 69*scale, 175*scale, 76*scale], fill=(220, 205, 164))
          draw.text((179*scale, 65*scale), '基隆市中正區義一路56號2樓', font=addr_font, fill=cream)

          # Requested change: enlarge the top-right official-site label.
          website = '77waxing 官方網站 →'
          website_font = ImageFont.truetype(cjk_path, 10*scale)
          box = draw.textbbox((0, 0), website, font=website_font)
          text_w = box[2] - box[0]
          tx, ty = width - 10*scale - text_w, 4*scale
          draw.text((tx+scale, ty+scale), website, font=website_font, fill=(54, 48, 42))
          draw.text((tx, ty), website, font=website_font, fill=(232, 224, 212))

          # Baseline JPEG remains Gmail-safe; 4:4:4 avoids extra text chroma blur.
          canvas.save(
              out_path,
              'JPEG',
              quality=95,
              subsampling=0,
              optimize=True,
              progressive=False,
          )
          print('built', out_path, canvas.size, out_path.stat().st_size)
          PY

      - name: Validate footer asset
        run: |
          test "$(stat -c%s assets/email-footer-77waxing-v22.jpg)" -gt 30000
          file assets/email-footer-77waxing-v22.jpg | grep -q 'JPEG image data'
          python - <<'PY'
          from PIL import Image
          im = Image.open('assets/email-footer-77waxing-v22.jpg')
          assert im.size == (1560, 276), im.size
          assert im.mode == 'RGB', im.mode
          print('validated', im.size, im.mode)
          PY

      - name: Update Apps Script to v22
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps-script/Code.gs')
          s = p.read_text()
          replacements = {
              "const SCRIPT_VERSION = '2026-09-10-email-v21';": "const SCRIPT_VERSION = '2026-09-10-email-v22';",
              "const EMAIL_FOOTER_IMAGE = 'https://5j1u35k6.github.io/77-waxing-site/assets/email-footer-77waxing-v21.jpg';": "const EMAIL_FOOTER_IMAGE = 'https://5j1u35k6.github.io/77-waxing-site/assets/email-footer-77waxing-v22.jpg';",
              "77waxing｜Footer v21 正確格式圖片測試": "77waxing｜Footer v22 高解析圖片測試",
              "shell_('Footer v20 穩定圖片路徑測試'": "shell_('Footer v22 高解析圖片測試'",
              "這版使用全新檔名與真正 baseline JPEG，保留原山海構圖與手寫字，其他文字已放大，避免 Gmail 圖片代理沿用舊格式快取。": "這版沿用已驗證成功的 v21 山海構圖，輸出 3 倍像素密度並重新繪製主要文字；右上角官方網站文字同步放大。",
              "footer-baseline-jpeg-v21-sent:": "footer-hidpi-v22-sent:",
              "mode: 'baseline-jpeg-unique-path-v21'": "mode: 'baseline-jpeg-hidpi-v22'",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected v21 text: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Commit generated v22 asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/email-footer-77waxing-v22.jpg apps-script/Code.gs
          git commit -m 'fix: sharpen email footer and enlarge website label v22 [skip ci]'
          git push
