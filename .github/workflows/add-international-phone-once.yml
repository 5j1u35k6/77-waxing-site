name: Add international phone input once

on:
  push:
    paths:
      - '.github/workflows/add-international-phone-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply international phone update
        run: python3 .github/scripts/add_phone_once.py

      - name: Validate changed files
        shell: bash
        run: |
          set -euo pipefail
          cp assets/booking-core.js /tmp/booking-core.mjs
          node --check /tmp/booking-core.mjs
          grep -q 'Taiwan.*+886' assets/booking-core.js
          grep -q 'Japan.*+81' assets/booking-core.js
          grep -q 'customerPhoneInternational' assets/booking-core.js
          grep -q 'phone-composite' assets/booking-core.css
          grep -q 'booking-core.js?v=20260911-1132' booking/index.html
          grep -q 'Taiwan 必須 10 碼、Japan 必須 11 碼' PROJECT_STATE.md

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/booking-core.js assets/booking-core.css booking/index.html PROJECT_STATE.md
          git commit -m 'feat: add international mobile validation'
          git push origin HEAD:main
