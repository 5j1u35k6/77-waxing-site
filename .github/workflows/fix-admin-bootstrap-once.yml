name: Repair admin firebase bootstrap once

on:
  push:
    paths:
      - '.github/workflows/fix-admin-bootstrap-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore required admin Firebase bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/admin-firebase.js')
          text = p.read_text()
          anchor = 'const B = location.hostname.endsWith("github.io") ? REPO_BASE : "";\n'
          block = '''\nlet app = null;\nlet auth = null;\nlet db = null;\nlet adminUnsubscribe = null;\nlet authPersistenceReady = Promise.resolve();\n\nif (firebaseConfigured) {\n  app = initializeApp(firebaseConfig);\n  auth = getAuth(app);\n  db = getFirestore(app);\n  authPersistenceReady = setPersistence(auth, browserLocalPersistence).catch(() => {});\n}\n'''
          if 'let auth = null;' not in text:
              if anchor not in text:
                  raise SystemExit('admin bootstrap anchor not found')
              text = text.replace(anchor, anchor + block, 1)
          old = '''async function verifyAdmin(user) {\n  if (!user || user.isAnonymous) return false;\n  try {\n    await getDoc(doc(db, "admins", user.uid));\n    return true;\n  } catch {\n    return false;\n  }\n}\n'''
          new = '''async function verifyAdmin(user) {\n  if (!user || user.isAnonymous || !db) return false;\n  try {\n    const snapshot = await getDoc(doc(db, "admins", user.uid));\n    return snapshot.exists();\n  } catch {\n    return false;\n  }\n}\n'''
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Validate admin bootstrap
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'let auth = null;' assets/admin-firebase.js
          grep -q 'let db = null;' assets/admin-firebase.js
          grep -q 'initializeApp(firebaseConfig)' assets/admin-firebase.js
          grep -q 'getAuth(app)' assets/admin-firebase.js
          grep -q 'getFirestore(app)' assets/admin-firebase.js
          grep -q 'snapshot.exists()' assets/admin-firebase.js
          cp assets/admin-firebase.js /tmp/admin-firebase.mjs
          node --check /tmp/admin-firebase.mjs

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/admin-firebase.js
          git commit -m 'fix: restore admin Firebase initialization'
          git push origin HEAD:main
