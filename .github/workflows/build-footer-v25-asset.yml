name: Publish Gmail footer v25 asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-footer-v25-asset.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble prepared v25 JPEG
        run: |
          cat .tmp-v25/chunk0.b64 .tmp-v25/chunk1.b64 .tmp-v25/chunk2.b64 .tmp-v25/chunk3.b64 .tmp-v25/chunk4.b64 .tmp-v25/chunk5.b64 | base64 --decode > assets/email-footer-77waxing-v25.jpg
          test "$(stat -c%s assets/email-footer-77waxing-v25.jpg)" -gt 20000
          file assets/email-footer-77waxing-v25.jpg | grep -q 'JPEG image data'
          file assets/email-footer-77waxing-v25.jpg

      - name: Validate email/admin non-regression requirements
        run: |
          grep -q "email-footer-77waxing-v25.jpg" apps-script/Code.gs
          ! grep -q "inlineImages" apps-script/Code.gs
          ! grep -q "DriveApp.getFileById" apps-script/Code.gs
          grep -q "開始時間–服務結束時間" PROJECT_STATE.md
          grep -q "永久刪除" PROJECT_STATE.md
          grep -q "手機 Gmail 中，footer 必須是「信件正文內的圖片」" PROJECT_STATE.md

      - name: Commit final v25 asset and clean staging files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .tmp-v25
          git rm -f assets/email-footer-77waxing-v25.svg
          git rm .github/workflows/build-footer-v25-asset.yml
          git add assets/email-footer-77waxing-v25.jpg
          git commit -m 'fix: publish Gmail body footer v25 and preserve admin guards [skip ci]'
          git push
