name: Fix about layout once

on:
  push:
    paths:
      - '.github/workflows/fix-about-layout-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply final brand story layout
        run: python3 scripts/fix-about-layout-once.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/pages.js
          grep -q '<h1>品牌故事</h1><p class="lead">保養不只是技術，更是一場好好對待自己的儀式。</p>' assets/pages.js
          grep -q '從香港到台灣，跨越海峽的不只是距離，還有對理想生活的堅持。</p><p>還記得初訪台灣旅遊' assets/pages.js
          grep -q 'about-story-art-reflection' assets/pages.js
          grep -q '很多時候，我們習慣了把照顧別人的優先順序放在最前面，卻忘了停下來好好看看自己。</p><p>當你因為肌膚或毛髮問題感到不自信時' assets/pages.js
          ! grep -q '<blockquote class="about-story-quote"' assets/pages.js
          grep -q '不得另外在頁面中重複顯示該小標' PROJECT_STATE.md
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pages.js assets/about-story.css index.html PROJECT_STATE.md
          git commit -m 'feat: finalize brand story section layout'
          git push origin main
