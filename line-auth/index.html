<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f4ee">
  <title>77waxing｜LINE 登入</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f8f4ee;color:#292724;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
    main{text-align:center;max-width:420px}
    h1{font-size:20px;margin:0 0 10px}
    p{margin:0;color:#6d665f;line-height:1.7}
  </style>
</head>
<body>
  <main>
    <h1>正在完成 LINE 登入</h1>
    <p id="status">請稍候，正在驗證會員身分…</p>
  </main>
  <script>
    (()=>{
      const LINE_AUTH_PROXY_URL='https://77waxing-line-auth-proxy.max19450.workers.dev/';
      const PENDING_TARGET_KEY='77waxing_member_pending_target';
      const LINE_STATE_KEY='77waxing_line_oauth_state';
      const HOME='https://5j1u35k6.github.io/77-waxing-site/';
      const status=document.getElementById('status');
      const params=new URLSearchParams(location.search);
      const state=String(params.get('state')||'').trim();
      const code=String(params.get('code')||'').trim();
      const error=String(params.get('error')||'').trim();
      const expectedState=String(sessionStorage.getItem(LINE_STATE_KEY)||'').trim();
      const target=String(sessionStorage.getItem(PENDING_TARGET_KEY)||HOME);

      function safeTarget(value){
        const text=String(value||'');
        return text.startsWith(HOME)?text:HOME;
      }
      function finish(fragment,destination=target){
        const base=safeTarget(destination).split('#')[0];
        location.replace(`${base}#${fragment}`);
      }
      async function exchange(){
        const response=await fetch(LINE_AUTH_PROXY_URL,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({action:'line_exchange',state,code}),
          credentials:'omit',
          cache:'no-store',
        });
        const result=await response.json().catch(()=>({}));
        if(!response.ok||!result||!result.ok||!result.customToken){
          const errorCode=String(result&&result.error||`proxy_http_${response.status}`);
          finish(`77line_error=${encodeURIComponent(errorCode)}&77line_state=${encodeURIComponent(state)}`);
          return;
        }
        const destination=safeTarget(result.target||target);
        finish(`77line_token=${encodeURIComponent(result.customToken)}&77line_state=${encodeURIComponent(state)}`,destination);
      }

      if(!state||!expectedState||state!==expectedState){
        status.textContent='LINE 登入驗證狀態不一致，正在返回網站…';
        finish(`77line_error=state_mismatch&77line_state=${encodeURIComponent(state)}`);
        return;
      }
      if(error){
        status.textContent='LINE 登入未完成，正在返回網站…';
        finish(`77line_error=${encodeURIComponent(error)}&77line_state=${encodeURIComponent(state)}`);
        return;
      }
      if(!code){
        status.textContent='LINE 未回傳登入憑證，正在返回網站…';
        finish(`77line_error=missing_code&77line_state=${encodeURIComponent(state)}`);
        return;
      }

      status.textContent='LINE 已完成授權，正在建立會員登入…';
      exchange().catch((exchangeError)=>{
        console.error('LINE proxy exchange failed',exchangeError);
        finish(`77line_error=proxy_network_failed&77line_state=${encodeURIComponent(state)}`);
      });
    })();
  </script>
</body>
</html>
