<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F9F6F0">
  <meta name="description" content="77select 產品訂購｜77waxing 官方選物與保養商品">
  <meta property="og:title" content="77select｜產品訂購">
  <meta property="og:description" content="77select｜77waxing 官方產品選物與訂購頁">
  <meta property="og:type" content="website">
  <title>77select｜產品訂購</title>
  <link rel="stylesheet" href="./styles.css?v=20260913-shop2">
  <link rel="stylesheet" href="./ui-overrides.css?v=20260913-select1">
  <link rel="stylesheet" href="./regional-store.css?v=20260913-region3">
  <link rel="stylesheet" href="./hero-effects.css?v=20260913-hero1">
  <link rel="stylesheet" href="./product-detail-polish.css?v=20260913-detail1">
  <link rel="stylesheet" href="./product-card-format.css?v=20260913-card3">
</head>
<body>
  <header class="shop-nav">
    <a class="shop-brand" href="/77-waxing-site/" target="_blank" rel="noopener"><b>77</b>select<small>BY 77WAXING</small></a>
    <nav class="shop-tabs" aria-label="產品訂購導覽">
      <button class="on" type="button" data-tab="shop">商品</button>
      <button type="button" data-tab="orders">我的訂單</button>
      <button type="button" data-tab="contact">聯絡</button>
    </nav>
    <button id="cart-open" class="cart-btn" type="button" aria-label="開啟購物車">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6.8 8.5h10.4l1 11H5.8l1-11Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M9 9V7a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span id="cart-count" class="cart-count">0</span>
    </button>
  </header>

  <main>
    <section class="hero" data-view="shop">
      <div class="hero-inner">
        <span id="hero-eyebrow" class="eyebrow" hidden></span>
        <h1 id="hero-title">把日常保養需要的，簡單整理給你。</h1>
        <p id="hero-description" hidden></p>
        <button id="hero-shop" class="primary-btn" type="button">開始選購</button>
      </div>
    </section>

    <section class="section" data-view="shop">
      <div class="wrap">
        <div class="section-head">
          <div><h2>產品目錄</h2><p id="connection-state">正在建立安全連線…</p></div>
          <div id="category-filters" class="filters" aria-label="商品分類"></div>
        </div>
        <div id="product-grid" class="product-grid"><div class="empty-state">正在載入商品…</div></div>
      </div>
    </section>

    <section class="section hidden" data-view="orders">
      <div class="wrap">
        <div class="section-head"><div><h2>我的訂單</h2><p>同一瀏覽器送出的訂單會安全綁定在目前裝置的匿名帳號。</p></div></div>
        <div id="orders-list" class="orders-list"><div class="empty-state">正在同步訂單…</div></div>
      </div>
    </section>

    <section class="section hidden" data-view="contact">
      <div class="wrap">
        <div class="section-head"><div><h2>產品與訂單問題</h2><p>留下問題後，店家回覆會顯示在本頁紀錄中。</p></div></div>
        <div class="panel">
          <form id="qa-form" class="qa-form">
            <div class="form-grid">
              <div class="field"><label for="qa-name">姓名</label><input id="qa-name" autocomplete="name" maxlength="80" required></div>
              <div class="field"><label for="qa-email">Email</label><input id="qa-email" type="email" autocomplete="email" maxlength="160" required></div>
              <div class="field wide"><label for="qa-content">問題內容</label><textarea id="qa-content" rows="5" maxlength="1500" required></textarea></div>
            </div>
            <button id="qa-submit" class="primary-btn" type="submit">送出問題</button>
          </form>
        </div>
        <div style="height:20px"></div>
        <div id="messages-list" class="messages-list"><div class="empty-state">尚無留言紀錄。</div></div>
      </div>
    </section>
  </main>

  <div id="cart-wrap" class="hidden">
    <button id="cart-backdrop" class="drawer-backdrop" type="button" aria-label="關閉購物車"></button>
    <aside class="drawer" aria-label="購物車">
      <div class="drawer-head"><b>購物車</b><button id="cart-close" class="icon-btn" type="button">關閉</button></div>
      <div id="cart-items" class="drawer-body"></div>
      <div class="drawer-foot" style="display:block">
        <div class="totals-line total"><span>商品小計</span><b id="cart-subtotal">NT$0</b></div>
        <button id="checkout-open" class="primary-btn" style="width:100%;margin-top:12px" type="button">填寫訂購資料</button>
      </div>
    </aside>
  </div>

  <div id="product-modal-wrap" class="hidden">
    <button id="product-detail-backdrop" class="modal-backdrop" type="button" aria-label="關閉商品詳情"></button>
    <section class="modal" role="dialog" aria-modal="true" aria-label="商品詳情">
      <div class="modal-head"><b>商品詳情</b><button id="product-detail-close" class="icon-btn" type="button">關閉</button></div>
      <div id="product-detail-body" class="modal-body"></div>
      <div class="modal-foot"><span></span><button id="product-detail-add" class="primary-btn" type="button">加入購物車</button></div>
    </section>
  </div>

  <div id="checkout-wrap" class="hidden">
    <button id="checkout-backdrop" class="modal-backdrop" type="button" aria-label="關閉結帳"></button>
    <section class="modal" role="dialog" aria-modal="true" aria-label="訂購資料">
      <div class="modal-head"><div><b>填寫訂購資料</b><div class="order-date">送出後由 77select 確認庫存與最終金額。</div></div><button id="checkout-close" class="icon-btn" type="button">關閉</button></div>
      <form id="checkout-form">
        <div class="modal-body">
          <div class="form-grid">
            <div class="field"><label for="checkout-name">收件人姓名 *</label><input id="checkout-name" autocomplete="name" maxlength="80" required></div>
            <div class="field"><label for="checkout-phone">聯絡電話 *</label><input id="checkout-phone" type="tel" autocomplete="tel" maxlength="30" required></div>
            <div class="field wide"><label for="checkout-email">Email *</label><input id="checkout-email" type="email" autocomplete="email" maxlength="160" required></div>
            <div class="field"><label>交付方式 *</label><div id="delivery-options"></div></div>
            <div class="field"><label>付款方式 *</label><div id="payment-options"></div></div>
            <div id="store-fields" class="wide hidden">
              <div class="form-grid">
                <div class="field"><label for="checkout-store-name">超商門市名稱 *</label><input id="checkout-store-name" maxlength="80"></div>
                <div class="field"><label for="checkout-store-id">門市店號 *</label><input id="checkout-store-id" maxlength="40"></div>
              </div>
            </div>
            <div class="field wide"><label for="checkout-note">備註</label><textarea id="checkout-note" rows="3" maxlength="1000"></textarea></div>
          </div>
          <p id="delivery-note" class="order-date"></p>
          <div id="checkout-summary" class="checkout-total"></div>
          <label class="check-line" style="margin-top:18px"><input id="checkout-terms" type="checkbox" required><span>我已閱讀並同意 <a href="./policies.html" target="_blank" rel="noopener"><u>訂購、退換貨與隱私說明</u></a>。本站不會要求在網頁中輸入信用卡卡號。</span></label>
        </div>
        <div class="modal-foot"><span></span><button id="checkout-submit" class="primary-btn" type="submit">送出訂單</button></div>
      </form>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <p>© 2026 77select by 77waxing. All Rights Reserved.</p>
    <p><a href="./policies.html">訂購與隱私說明</a>｜<a id="store-email-link" href="mailto:77waxing.mail@gmail.com">77waxing.mail@gmail.com</a>｜<a href="/77-waxing-site/" target="_blank" rel="noopener">77waxing 官方網站</a></p>
  </footer>
  <script type="module" src="./app.js?v=20260913-shop2"></script>
  <script type="module" src="./regional-store.js?v=20260913-region2"></script>
  <script type="module" src="./public-enhancements.js?v=20260913-select4"></script>
  <script type="module" src="./product-card-format.js?v=20260913-card3"></script>
</body>
</html>
