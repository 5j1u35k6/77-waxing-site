<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#312f2d">
<title>77waxing｜互動開場 Demo</title>
<style>
*{box-sizing:border-box}
:root{--cream:#F9F6F0;--paper:#FFFDF9;--ink:#3A3836;--deep:#262422;--gold:#C5A070;--soft:#E6DFC8;--muted:#8B7355}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;background:var(--deep);color:var(--cream);overflow-x:hidden}
button,a{font:inherit}
.demo{min-height:100svh;position:relative;overflow:hidden;background:var(--deep)}
.home-preview{position:absolute;inset:0;background:var(--cream);color:var(--ink);opacity:0;visibility:hidden;overflow:auto}
.home-header{height:76px;display:flex;align-items:center;gap:28px;padding:0 max(20px,calc((100vw - 1180px)/2));border-bottom:1px solid rgba(58,56,54,.08);background:rgba(249,246,240,.92)}
.logo{font:28px Georgia,"Times New Roman",serif;margin-right:auto}.logo b{color:var(--gold)}
.home-header nav{display:flex;gap:22px;font-size:12px;letter-spacing:.08em}.home-header a{color:inherit;text-decoration:none}.home-header .book{background:var(--ink);color:var(--cream);padding:10px 17px;border-radius:999px}
.hero{width:min(1180px,calc(100% - 40px));min-height:calc(100svh - 76px);margin:auto;display:grid;grid-template-columns:1.05fr .85fr;gap:72px;align-items:center;padding:56px 0 78px}
.hero-copy{max-width:700px}.eyebrow{display:block;color:#7d705d;font-size:12px;font-weight:700;letter-spacing:.18em;margin-bottom:14px}.hero h1{font:500 clamp(44px,6vw,78px)/1.16 Georgia,"Noto Serif TC",serif;letter-spacing:-.03em;margin:0 0 22px}.hero p{font-size:18px;line-height:1.8;color:#6d665e;margin:0}.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.hero-actions span{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border:1px solid var(--ink);border-radius:999px;font-weight:700}.hero-actions .dark{background:var(--ink);color:var(--cream)}
.hero-art{min-height:500px;border-radius:210px 210px 30px 30px;background:linear-gradient(145deg,#e6dfc8,#c5a070 68%,#9b9b88);position:relative;overflow:hidden;box-shadow:0 24px 70px rgba(58,56,54,.09)}.hero-art:before{content:"77";font:210px Georgia;color:rgba(249,246,240,.23);position:absolute;right:-20px;top:25px}
.intro{position:absolute;inset:0;display:grid;place-items:center;background:var(--deep);z-index:10;overflow:hidden}
.intro:before{content:"";position:absolute;width:min(900px,90vw);height:min(900px,90vw);border-radius:50%;background:radial-gradient(circle,rgba(197,160,112,.12),rgba(197,160,112,0) 68%);filter:blur(6px);opacity:.75}
.intro-copy{position:absolute;top:clamp(34px,8vh,76px);left:50%;transform:translateX(-50%);text-align:center;width:min(720px,calc(100% - 40px));z-index:3}.intro-copy small{display:block;letter-spacing:.24em;font-size:11px;color:#cdbda8;margin-bottom:10px}.intro-copy h1{margin:0;font:500 clamp(30px,4.3vw,58px)/1.2 Georgia,"Noto Serif TC",serif;letter-spacing:.01em}.intro-copy p{margin:12px 0 0;color:#b9ada1;font-size:14px}.intro-copy .warmline{opacity:0;color:#e8d7bd;margin-top:10px;font-size:15px}
.lamp-wrap{position:relative;width:min(420px,84vw);height:460px;display:grid;place-items:center;margin-top:62px;z-index:3}.lamp{position:relative;width:250px;height:340px;transform-origin:50% 24px}.lamp-glow{position:absolute;left:50%;top:100px;width:520px;height:520px;transform:translate(-50%,-50%) scale(.25);border-radius:50%;background:radial-gradient(circle,rgba(255,224,164,.5) 0%,rgba(232,195,132,.28) 28%,rgba(197,160,112,.08) 58%,rgba(197,160,112,0) 72%);filter:blur(4px);opacity:0;pointer-events:none}.shade{position:absolute;left:50%;top:62px;width:205px;height:92px;transform:translateX(-50%);background:var(--cream);clip-path:polygon(24% 0,76% 0,100% 82%,91% 100%,9% 100%,0 82%);filter:drop-shadow(0 8px 14px rgba(0,0,0,.18))}.shade:after{content:"";position:absolute;inset:auto 9% 0;height:12px;border-radius:50%;background:#e3ddd5}.stem{position:absolute;top:149px;left:50%;width:12px;height:158px;transform:translateX(-50%);border-radius:999px;background:linear-gradient(90deg,#d4cdc4,#f7f0e7 55%,#bcb4aa)}.base{position:absolute;left:50%;top:300px;width:86px;height:14px;transform:translateX(-50%);border-radius:999px;background:linear-gradient(180deg,#f6f0e7,#bdb5aa)}
.cord-hit{position:absolute;top:128px;left:64%;width:86px;height:205px;border:0;background:transparent;cursor:pointer;padding:0;touch-action:manipulation}.cord{position:absolute;left:50%;top:0;width:2px;height:118px;transform:translateX(-50%);background:#9e8d79;transform-origin:top}.cord-knob{position:absolute;left:50%;top:112px;width:16px;height:16px;transform:translateX(-50%);border-radius:50%;background:var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.28)}.hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.16em;color:#b4a99c;white-space:nowrap}.hint:after{content:"";display:block;width:1px;height:26px;background:#81786f;margin:8px auto 0}
.skip{position:absolute;right:28px;top:24px;z-index:20;border:1px solid rgba(249,246,240,.18);background:rgba(255,255,255,.03);color:#d3c8bb;border-radius:999px;padding:8px 13px;font-size:12px;cursor:pointer}.replay{position:fixed;right:20px;bottom:20px;z-index:30;border:1px solid rgba(58,56,54,.16);background:rgba(255,253,249,.92);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:12px;box-shadow:0 8px 30px rgba(58,56,54,.09);cursor:pointer;opacity:0;pointer-events:none}.demo-badge{position:fixed;left:20px;bottom:20px;z-index:30;padding:8px 12px;border-radius:999px;background:rgba(58,56,54,.86);color:var(--cream);font-size:11px;letter-spacing:.08em;opacity:0;pointer-events:none}
@media(max-width:850px){.home-header{height:64px}.home-header nav{display:none}.hero{grid-template-columns:1fr;gap:30px;padding:28px 0 60px}.hero-art{order:-1;min-height:330px;border-radius:130px 130px 26px 26px}.intro-copy{top:36px}.lamp-wrap{height:420px;margin-top:78px}.lamp{transform:scale(.92)}.skip{right:16px;top:16px}}
@media(max-width:520px){.hero{width:calc(100% - 28px)}.hero h1{font-size:44px}.hero p{font-size:16px}.hero-art{min-height:300px}.intro-copy{top:30px}.intro-copy h1{font-size:34px}.intro-copy p{font-size:13px}.lamp-wrap{height:390px;margin-top:98px}.lamp{transform:scale(.83)}.hint{bottom:10px}.demo-badge{display:none}}
@media(prefers-reduced-motion:reduce){.hint{display:none}}
</style>
</head>
<body>
<main class="demo" id="demo">
  <section class="home-preview" id="homePreview" aria-hidden="true">
    <header class="home-header"><div class="logo"><b>77</b>waxing</div><nav><a>首頁</a><a>關於</a><a>服務</a><a>價目</a><a>空間</a><a>教學</a><a class="book">立即預約</a></nav></header>
    <div class="hero">
      <div class="hero-copy">
        <span class="eyebrow">77WAXING · KEELUNG BEAUTY STUDIO</span>
        <h1>把第一次的緊張，<br>交給 77 的細心與溫柔。</h1>
        <p>怕痛、害羞、不知道第一次要準備什麼，都不用先變成專家。把服務、流程、價目與預約說清楚，讓你在決定以前就先感到安心。</p>
        <div class="hero-actions"><span class="dark">預約時段讓自己更好</span><span>77waxing提供的服務</span></div>
      </div>
      <div class="hero-art" aria-hidden="true"></div>
    </div>
  </section>

  <section class="intro" id="intro" aria-label="77waxing 開場動畫">
    <button class="skip" id="skip" type="button">略過</button>
    <div class="intro-copy">
      <small>77WAXING · WARM LIGHT</small>
      <h1>今日，都留一點時間俾自己。</h1>
      <p>輕輕拉一下，點亮 77waxing。</p>
      <p class="warmline" id="warmline">準備好喇，等77waxing好好照顧妳。</p>
    </div>
    <div class="lamp-wrap">
      <div class="lamp-glow" id="glow"></div>
      <div class="lamp" id="lamp">
        <div class="shade"></div>
        <div class="stem"></div>
        <div class="base"></div>
        <button class="cord-hit" id="cordHit" type="button" aria-label="拉一下燈繩，點亮 77waxing">
          <span class="cord" id="cord"></span><span class="cord-knob" id="knob"></span>
        </button>
      </div>
      <div class="hint" id="hint">點一下拉繩</div>
    </div>
  </section>
</main>
<button class="replay" id="replay" type="button">重新播放開場</button>
<div class="demo-badge" id="badge">INTRO DEMO · 尚未套用正式首頁</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
(() => {
  const intro=document.getElementById('intro');
  const home=document.getElementById('homePreview');
  const cord=document.getElementById('cord');
  const knob=document.getElementById('knob');
  const lamp=document.getElementById('lamp');
  const glow=document.getElementById('glow');
  const hint=document.getElementById('hint');
  const warmline=document.getElementById('warmline');
  const skip=document.getElementById('skip');
  const replay=document.getElementById('replay');
  const badge=document.getElementById('badge');
  const hit=document.getElementById('cordHit');
  let running=false;

  function finishInstant(){
    if(running)return;
    running=true;
    gsap.killTweensOf('*');
    gsap.set(home,{autoAlpha:1});
    home.setAttribute('aria-hidden','false');
    gsap.set(intro,{autoAlpha:0,pointerEvents:'none'});
    gsap.to([replay,badge],{opacity:1,duration:.25,onComplete:()=>{replay.style.pointerEvents='auto'}});
    running=false;
  }

  function play(){
    if(running)return;
    running=true;
    hit.disabled=true;
    const tl=gsap.timeline({defaults:{ease:'power2.out'}});
    tl.to(cord,{scaleY:1.26,duration:.16},0)
      .to(knob,{y:31,duration:.16},0)
      .to(lamp,{rotation:1.8,duration:.16,transformOrigin:'50% 10%'},0)
      .to(cord,{scaleY:1,duration:.33,ease:'elastic.out(1,.42)'},.16)
      .to(knob,{y:0,duration:.33,ease:'elastic.out(1,.42)'},.16)
      .to(lamp,{rotation:-1.1,duration:.25},.16)
      .to(lamp,{rotation:0,duration:.42,ease:'elastic.out(1,.55)'},.35)
      .to(glow,{opacity:1,scale:1,duration:.62,ease:'power2.out'},.2)
      .to(intro,{backgroundColor:'#51493f',duration:.55},.22)
      .to(hint,{opacity:0,y:8,duration:.28},.18)
      .to(warmline,{opacity:1,y:-4,duration:.48},.66)
      .to(glow,{scale:4.8,opacity:.98,duration:1.05,ease:'power2.inOut'},1.25)
      .to(intro,{backgroundColor:'#F9F6F0',duration:.72},1.36)
      .set(home,{autoAlpha:1},1.62)
      .set(home,{attr:{'aria-hidden':'false'}},1.62)
      .fromTo('.home-header',{y:-18,opacity:0},{y:0,opacity:1,duration:.58},1.68)
      .fromTo('.hero-copy > *',{y:22,opacity:0},{y:0,opacity:1,duration:.62,stagger:.08},1.76)
      .fromTo('.hero-art',{scale:.96,opacity:0},{scale:1,opacity:1,duration:.82},1.88)
      .to(intro,{autoAlpha:0,duration:.52,pointerEvents:'none'},2.05)
      .to([replay,badge],{opacity:1,duration:.35,onComplete:()=>{replay.style.pointerEvents='auto';running=false}},2.32);
  }

  function reset(){
    running=false;
    hit.disabled=false;
    replay.style.pointerEvents='none';
    gsap.killTweensOf('*');
    gsap.set(intro,{clearProps:'all'});
    gsap.set(home,{autoAlpha:0});
    home.setAttribute('aria-hidden','true');
    gsap.set([replay,badge],{opacity:0});
    gsap.set([cord,knob,lamp,glow,hint,warmline],{clearProps:'all'});
    gsap.set('.home-header,.hero-copy > *,.hero-art',{clearProps:'all'});
  }

  hit.addEventListener('click',play);
  skip.addEventListener('click',finishInstant);
  replay.addEventListener('click',reset);

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    hint.textContent='點一下進入';
  }
})();
</script>
</body>
</html>
